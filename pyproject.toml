[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-ticker"
version = "0.3.0"
description = "Quick no-key stock quotes for the terminal"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ticker contributors" }]

[project.scripts]
ticker = "ticker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
